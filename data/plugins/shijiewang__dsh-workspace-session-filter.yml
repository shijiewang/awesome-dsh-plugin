description:
  en: 'Three filter chips at the foot of the sidebar: one counts the sessions that are running, one those waiting for your approval, plan review or answer, and one those with something unread (a turn that finished unseen, or newer activity the panel has not been opened on); each opens a popover listing those sessions grouped by workspace where a row opens the session. A separate panel adds an all-sessions chip and a more menu that filters by the last day, three days, week or thirty days.'
  zh: '侧边栏底部的三个筛选 chip：分别统计正在运行、在等你确认（审批、计划审阅、待回答）、以及有未读内容（跑完没看，或最近有更新但没打开过）的会话，各自带当前数量；点开就在上方按工作区分组列出命中会话，点行直接打开。另有完整面板，多一个「全部」chip 和「更多」菜单，可按最近一天、三天、一周、三十天筛选。'
